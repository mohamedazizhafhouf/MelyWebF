<p-toast></p-toast>
<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, #0f766e 10%, rgba(15, 118, 110, 0.05) 35%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 auth-card" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <div class="mely-badge mb-6 mx-auto">Mely</div>
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">Welcome back to Mely</div>
                    <span class="text-muted-color font-medium">Track your finances with clarity and Islamic values.</span>
                </div>

                <div>
                    <label for="mely-login-email" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Email</label>
                    <input pInputText id="mely-login-email" type="email" placeholder="you@example.com" class="w-full md:w-120 mb-6" [(ngModel)]="email" />

                    <label for="mely-login-password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Password</label>
                    <p-password id="mely-login-password" [(ngModel)]="password" placeholder="Enter your password" [toggleMask]="true" styleClass="mb-4" [fluid]="true" [feedback]="false"></p-password>

                    <div class="flex items-center justify-between mt-2 mb-8 gap-8">
                        <div class="flex items-center">
                            <p-checkbox [(ngModel)]="rememberMe" id="rememberme" binary class="mr-2"></p-checkbox>
                            <label for="rememberme">Keep me signed in</label>
                        </div>
                        <a routerLink="/auth/register" class="font-medium no-underline text-right cursor-pointer text-primary">Create an account</a>
                    </div>

                    <p-button [label]="isSubmitting ? 'Signing In...' : 'Sign In'" styleClass="w-full" [disabled]="isSubmitting" (click)="onLogin()"></p-button>
                </div>
            </div>
        </div>
    </div>
</div>
